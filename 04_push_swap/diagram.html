<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push Swap Project Diagram</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #38bdf8;
        --accent-2: #818cf8;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --ok: #34d399;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #020617, #0f172a);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(1100px, 100%);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        padding: 24px;
      }

      h1 {
        margin-top: 0;
        font-size: 1.8rem;
        color: var(--accent);
      }

      p {
        color: var(--muted);
        line-height: 1.5;
      }

      svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .box {
        fill: #1f2937;
        stroke: var(--accent-2);
        stroke-width: 2;
      }

      .box-alt {
        fill: #111827;
        stroke: var(--accent);
        stroke-width: 2;
      }

      .title {
        fill: var(--text);
        font-size: 16px;
        font-weight: 700;
      }

      .subtitle {
        fill: var(--muted);
        font-size: 12px;
      }

      .arrow {
        stroke: #60a5fa;
        stroke-width: 2.4;
        fill: none;
        marker-end: url(#arrowhead);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Push Swap Project Flow</h1>
      <p>This diagram summarizes the main flow of the program and its key modules.</p>
      <svg viewBox="0 0 1000 620" role="img" aria-label="Push Swap architecture diagram">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"></polygon>
          </marker>
        </defs>

        <rect x="40" y="40" width="920" height="540" rx="20" fill="rgba(255,255,255,0.03)"></rect>

        <rect class="box" x="80" y="90" width="180" height="90" rx="12"></rect>
        <text class="title" x="170" y="125" text-anchor="middle">Input</text>
        <text class="subtitle" x="170" y="147" text-anchor="middle">Arguments and integers</text>

        <rect class="box" x="330" y="90" width="190" height="90" rx="12"></rect>
        <text class="title" x="425" y="125" text-anchor="middle">Parsing &amp; Validation</text>
        <text class="subtitle" x="425" y="147" text-anchor="middle">Check format and duplicates</text>

        <rect class="box" x="590" y="90" width="180" height="90" rx="12"></rect>
        <text class="title" x="680" y="125" text-anchor="middle">Options</text>
        <text class="subtitle" x="680" y="147" text-anchor="middle">Modes and bench flag</text>

        <rect class="box-alt" x="270" y="260" width="220" height="100" rx="12"></rect>
        <text class="title" x="380" y="295" text-anchor="middle">Stack Initialization</text>
        <text class="subtitle" x="380" y="317" text-anchor="middle">Create stacks A and B</text>

        <rect class="box-alt" x="540" y="260" width="240" height="100" rx="12"></rect>
        <text class="title" x="660" y="295" text-anchor="middle">Strategy Selection</text>
        <text class="subtitle" x="660" y="317" text-anchor="middle">Simple / Medium / Complex / Adaptive</text>

        <rect class="box" x="250" y="440" width="220" height="100" rx="12"></rect>
        <text class="title" x="360" y="475" text-anchor="middle">Operations</text>
        <text class="subtitle" x="360" y="497" text-anchor="middle">sa / pa / ra / rra / pb / rb / rrb</text>

        <rect class="box" x="540" y="440" width="220" height="100" rx="12"></rect>
        <text class="title" x="650" y="475" text-anchor="middle">Output &amp; Bench</text>
        <text class="subtitle" x="650" y="497" text-anchor="middle">Print instructions and statistics</text>

        <line class="arrow" x1="260" y1="135" x2="330" y2="135"></line>
        <line class="arrow" x1="520" y1="135" x2="590" y2="135"></line>
        <line class="arrow" x1="425" y1="180" x2="380" y2="260"></line>
        <line class="arrow" x1="680" y1="180" x2="660" y2="260"></line>
        <line class="arrow" x1="380" y1="360" x2="360" y2="440"></line>
        <line class="arrow" x1="660" y1="360" x2="650" y2="440"></line>
        <line class="arrow" x1="470" y1="490" x2="540" y2="490"></line>
      </svg>
    </div>
  </body>
</html>
